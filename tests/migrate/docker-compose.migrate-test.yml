# PR-1a (AUD-002): ephemeral postgres for the migration-runner e2e harness.
# Throwaway — `run-migrate-tests.sh` brings it up on an unused port, seeds a
# synthetic prod-like schema, exercises scripts/migrate.sh, then tears it down
# with `down -v`. NEVER point this at a real volume.
name: infrasafe-migrate-test

services:
  postgres:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infrasafe_migrate_test
    # no host port needed — the runner talks via `docker compose exec`
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "infrasafe_migrate_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral storage; nothing persists

  # Node image used ONLY to exercise migrate.sh's image-mode discover_js fallback
  # (the production path: deploy hosts have no host node — node lives only inside
  # an image). The runner resolves this service's image via `compose config
  # --images mignode` and `docker run`s it ad-hoc; it does real work as an exited
  # one-shot so `up` pulls the image without leaving a lingering container.
  mignode:
    image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    command: ["node", "--version"]
    restart: "no"
