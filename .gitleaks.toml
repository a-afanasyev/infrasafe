# Gitleaks configuration — secret-scan tuning for InfraSafe.
#
# The default rule set is strict; this file declares allowlist
# exceptions for known-safe placeholders in test fixtures and the
# .env.example file (placeholders that LOOK like secrets but aren't).
#
# Docs: https://github.com/gitleaks/gitleaks#configuration

title = "InfraSafe gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known placeholder secrets in fixtures and examples"

# [N-11] Исключения ПО ПУТИ — только файлы, где секрета быть не может по
# устройству. Раньше здесь целиком стояли docs/*.md, README, CLAUDE.md и тесты —
# ровно те места, где секреты утекают чаще всего (ранбуки с командами), и
# 28.09.2026 проверка нашла в docs значения настоящих, пусть уже ротированных
# секретов. Плейсхолдеры в документах и тестах исключаются ниже ПО ЗНАЧЕНИЮ.
paths = [
    '''\.env\.example$''',
    '''package-lock\.json$''',
    # SHA-256 файлов миграций (манифест раннера) — 64 hex, как у секретов.
    # Общее правило «64 hex» спрятало бы и настоящий секрет вебхука.
    '''database/init/99_schema_migrations_baseline\.sql$''',
]

# Specific placeholder regex patterns used in this codebase.
regexes = [
    # ".env.example" + test fixtures use these literal placeholders.
    '''CHANGE_ME''',
    '''dev-secret-key-change-in-production''',
    '''dev-refresh-secret-key-change-in-production''',
    '''ci-test-jwt-secret-not-for-production''',
    '''ci-test-refresh-secret-not-for-production''',

    # Test data — admin/admin123 + testuser/TestPass123 documented in
    # CLAUDE.md and used throughout integration tests. Not production.
    '''TestPass123''',
    '''admin123''',

    # JWT example tokens used in unit tests as fixtures.
    '''ey[A-Za-z0-9_-]{10,}\.ey[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}''',

    # Dev-only postgres bootstrap password in docker-compose. Production
    # bootstrap is done once at container init from .env.prod; this
    # literal is only relevant on fresh dev `docker compose up`.
    # Tracked for replacement with env_file substitution as a separate
    # follow-up — for now allowlisted explicitly.
    '''@ppl1c@ti0n''',

    # [N-11] Плейсхолдеры в документации: YOUR_JWT_TOKEN и подобные, а также
    # обрезанные примеры, оканчивающиеся на «...».
    '''^YOUR_[A-Z0-9_]+$''',
    '''\.\.\.$''',

    # [N-11] Не секреты, а идентификаторы, на которые срабатывает generic-api-key:
    # метка HKDF, поле формы, путь API, имя переменной в тесте.
    '''^infrasafe-totp-v1$''',
    '''^capacity_m3_per_hour$''',
    '''^acknowledge/resolve$''',
    '''^origJwt2faSecret$''',

    # [N-11] Фикстуры тестов и CI: по имени видно, что это не прод.
    '''^0123456789abcdef0123456789abcdef$''',
    '''^MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=$''',
    '''^totp-(test-)?key-''',
    '''^distinct-2fa-secret-''',
    '''^secret-0123456789abcdef''',
    '''^test-(2fa-)?secret-''',
]
