<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>УК-сервис временно недоступен · InfraSafe</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #2c3e50;
        }
        .card {
            background: white;
            padding: 48px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .icon {
            font-size: 56px;
            margin-bottom: 16px;
            color: #00BFA5;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #5a6c7d;
            margin-bottom: 24px;
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a {
            display: inline-block;
            padding: 10px 20px;
            background: #00BFA5;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        a:hover { background: #009a85; }
        a.secondary {
            background: transparent;
            color: #00BFA5;
            border: 1px solid #00BFA5;
        }
        a.secondary:hover { background: rgba(0, 191, 165, 0.08); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#9888;</div>
        <h1>УК-сервис временно недоступен</h1>
        <p>Сервис управляющей компании временно не отвечает. Мониторинг InfraSafe работает в штатном режиме. Попробуйте обновить страницу через несколько минут.</p>
        <div class="actions">
            <a href="/">На главную InfraSafe</a>
            <a href="/uk/" class="secondary">Повторить попытку</a>
        </div>
    </div>
</body>
</html>
