<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
    <title>Сайт временно не работает · ProFK</title>
    <!--
      Страница ОБСЛУЖИВАНИЯ. Отдаётся со статусом 503 при поднятом флаге
      обслуживания (см. nginx.profk.conf, блок «режим обслуживания»).

      Правило вёрстки здесь одно и оно жёсткое: НИ ОДНОГО внешнего запроса —
      ни css, ни шрифтов, ни скриптов. Страница показывается ровно тогда,
      когда всё остальное отдаёт 503, поэтому любая внешняя зависимость на ней
      обернётся пустым экраном. Единственное исключение — favicon: он лежит в
      /brand/, который из режима обслуживания исключён, а его отсутствие
      страницу не ломает.

      Цвета взяты из брендбука ProFK (public/brand-profk/brand.css):
      акцент #44c24a, приглушённый зелёный #2b7a33, текст #333333.
    -->
    <meta http-equiv="refresh" content="300">
    <style>
        :root {
            --ink: #333333;
            --muted: #5b6660;
            --surface: #ffffff;
            --page: #f4f6f5;
            --border: #ececec;
            --accent: #2b7a33;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --ink: #e8ece9;
                --muted: #b9c1ba;
                --surface: #1d211f;
                --page: #141716;
                --border: #2c322f;
                --accent: #44c24a;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         'Helvetica Neue', Arial, sans-serif;
            background: var(--page);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.55;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .07);
        }
        .brand {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 28px;
        }
        h1 {
            font-size: 26px;
            font-weight: 650;
            margin-bottom: 16px;
            letter-spacing: -.01em;
        }
        p {
            color: var(--muted);
            font-size: 16px;
            margin-bottom: 12px;
        }
        p:last-of-type { margin-bottom: 0; }
        .divider {
            height: 1px;
            background: var(--border);
            margin: 28px 0 20px;
        }
        .note {
            font-size: 14px;
            color: var(--muted);
        }
        @media (max-width: 480px) {
            .card { padding: 36px 24px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">ProFK</div>

        <h1>Сайт временно не работает</h1>

        <p>Приносим извинения за неудобства.</p>
        <p>Мы проводим технические работы и вернёмся в ближайшее время.</p>

        <div class="divider"></div>

        <!--
          Контакты сюда НЕ вписаны намеренно: телефон и почту должен указать
          владелец, а выдуманные хуже, чем никакие. Раскомментируйте и
          заполните — или удалите блок вместе с этим комментарием.

        <p class="note">
            Срочные вопросы: <a href="tel:+998000000000">+998 00 000-00-00</a>
        </p>
        -->

        <p class="note">Страница обновится автоматически.</p>
    </main>
</body>
</html>
