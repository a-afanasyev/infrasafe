# docker-compose.profk.yml — profk.uz prod-from-scratch override.
# Layer:  docker compose -f docker-compose.unified.yml -f docker-compose.profk.yml ...
services:
  postgres:
    # Fresh DB: replace legacy database.sql with the concatenated canonical init
    # (database/init 01-09 bake migrations 003-017; 99 self-declares them). Single
    # file = same target as base → replaces source. migrate up applies 018+.
    volumes:
      - ./.deploy/profk-initdb.sql:/docker-entrypoint-initdb.d/database.sql:ro

  nginx:
    # profk.uz edge: staging-style override — point command + healthcheck at the
    # profk config fork and mount the host certbot tree.
    command: ["nginx", "-c", "/etc/nginx/custom/nginx.profk.conf", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "nginx", "-t", "-c", "/etc/nginx/custom/nginx.profk.conf"]
    # [Q-12] Сертификат — КАТАЛОГАМИ, не файлами. Файловый bind-mount симлинка
    # live/profk.uz/*.pem docker разыменовывает при старте и держит inode
    # archive/…N.pem: после продления certbot кладёт N+1 и переставляет ссылку, а
    # `nginx -s reload` продолжает читать старый файл до пересоздания контейнера
    # (та же ловушка, что [B-012] у конфига). Каталог разрешается при каждом
    # чтении. Цели совпадают с хостовыми путями — ссылки в live/ относительные
    # (../../archive/…). Только live/ и archive/: accounts/ (ключ ACME-аккаунта)
    # и renewal/ периметру не нужны. Ключ 0600 root читает мастер nginx — он
    # root в контейнере, владелец файла, DAC_OVERRIDE для этого не нужен.
    volumes:
      - /etc/letsencrypt/live:/etc/letsencrypt/live:ro
      - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro
