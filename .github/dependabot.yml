# Dependabot configuration — automated dependency updates.
#
# Schedules:
#   - npm: weekly (Mondays), grouped by minor/patch + open separately for major.
#   - github-actions: weekly, grouped.
#
# Security alerts fire immediately regardless of schedule.
# Reviewer assigned to author of repo by default.
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      # Group minor + patch bumps into a single PR per ecosystem run.
      # Major bumps stay individual so the reviewer can read changelogs.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Security updates are intentionally NOT grouped — each gets its
      # own PR so the urgency is visible per-CVE.

  - package-ecosystem: npm
    directory: /generator
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - automated
      - generator
    commit-message:
      prefix: "chore(deps-gen)"
      include: scope
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
      - automated
    commit-message:
      prefix: "chore(ci-deps)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
      - automated
    commit-message:
      prefix: "chore(docker-deps)"
