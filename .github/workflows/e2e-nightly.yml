# Имя файла осталось e2e-nightly.yml, чтобы не рвать историю прогонов; сам
# workflow больше не только ночной — см. [R2-14] ниже.
name: E2E (PR + nightly)

# [#150] Real-container E2E: brings up the full dev stack (app + PostGIS + frontend)
# and runs the cookie/2FA-aware E2E suite against the live API.
#
# [R2-14] Теперь гоняется И НА PR, не только по расписанию.
#
# Исходный довод «медленно и тяжело по докеру» не подтвердился: прогоны занимают
# 2–3 минуты (замерено по восьми ночным запускам 05–12.08.2026) — дешевле, чем
# job `Docker image` в основном CI, который и так собирает образ на каждом PR.
#
# А цена отсутствия проверки на PR измерена ровно один раз и точно: 12.08.2026
# правка M-5 (учёт неверного пароля в блокировке аккаунта) изменила ответ
# /auth/change-password с 429 на 401 и уронила E2E. Merge был в 04:31 UTC,
# ночной прогон поймал это в 04:43, а до тех пор main стоял с падающим E2E, и
# заметил бы это только следующий человек, запустивший его руками. На PR
# падение было бы видно ДО мержа.
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Новый пуш в PR отменяет предыдущий прогон — очередь не копится. Прогоны по
# расписанию и ручные НЕ отменяются: у них своя группа по run_id, поэтому
# отменять там нечего (ночной прогон на main не должен умирать от того, что
# кто-то открыл PR).
concurrency:
  group: >-
    e2e-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Docker stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker-compose.dev.yml
      # Dev stack secrets (test-only — never used for a real deployment).
      JWT_SECRET: ci-e2e-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-not-for-production
      # Valid base64 of 32 bytes ("0123456789abcdef0123456789abcdef") for AES-256-GCM.
      TOTP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # Raise the login/register caps so the suite's many fresh sessions from one IP
      # don't trip the rate limiters (passwordChangeLimiter stays at its default — a
      # test asserts it).
      RATE_LIMIT_AUTH_MAX: '10000'
      RATE_LIMIT_REGISTER_MAX: '10000'
      # E2E harness → API (dev compose: 127.0.0.1:3000) + DB (127.0.0.1:5435).
      E2E_BASE_URL: http://localhost:3000
      E2E_ORIGIN: http://localhost:3000
      E2E_DB_HOST: localhost
      E2E_DB_PORT: '5435'
      E2E_DB_USER: postgres
      E2E_DB_PASSWORD: postgres
      E2E_DB_NAME: infrasafe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install host deps (jest + supertest + pg + otplib for the harness)
        run: npm ci

      - name: Pre-create the logs bind-mount dir
        # docker-compose.dev.yml bind-mounts ./logs:/app/logs. On a fresh CI
        # checkout the dir doesn't exist, so dockerd creates it ROOT-owned and
        # the app (user nodejs, uid 1001) crashes at boot with EACCES opening
        # its winston log file — the app never became healthy in ANY nightly
        # run since this workflow was added. Create it as the runner user
        # (+world-writable in case the container uid ever changes).
        run: mkdir -p logs && chmod 0777 logs

      - name: Start the dev stack
        run: docker compose -f "$COMPOSE" up -d --build

      - name: Wait for the API to be healthy
        run: |
          cid="$(docker compose -f "$COMPOSE" ps -q app)"
          [ -n "$cid" ] || { echo "app container not found"; docker compose -f "$COMPOSE" ps; exit 1; }
          for i in $(seq 1 60); do
            s="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo missing)"
            [ "$s" = healthy ] && { echo "app healthy"; exit 0; }
            [ "$s" = unhealthy ] && break
            sleep 3
          done
          echo "::error::app did not become healthy"
          docker compose -f "$COMPOSE" logs app | tail -80
          exit 1

      - name: Apply pending migrations (init schema stops at 017 — 018+ are the runner's job)
        # database/init/ bakes the schema only up to migration 017 and
        # 99_schema_migrations_baseline self-declares 003-017; everything later
        # (Sprint 10 alert lifecycle v2 incl. reopen_chain_id, transformers
        # canonicalization, …) is applied by scripts/migrate.sh — same flow as
        # a fresh prod bootstrap. Without this the alert-lifecycle E2E hits
        # 500 "column reopen_chain_id does not exist".
        env:
          MIGRATE_COMPOSE_FILE: docker-compose.dev.yml
          MIGRATE_PG_USER: postgres
          MIGRATE_NODE_MODE: host
        run: |
          export MIGRATE_TARGET_COMMIT="$(git rev-parse HEAD)"
          bash scripts/migrate.sh status
          bash scripts/migrate.sh up

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE" logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE" down -v
