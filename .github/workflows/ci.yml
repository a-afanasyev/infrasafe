name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infrasafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: infrasafe_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run unit and integration tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/reports/coverage/
          retention-days: 14

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fail only on high/critical CVEs in production deps. Moderate is
      # informational — noisy across the dep tree and not actionable per-PR.
      - name: Audit production deps
        run: npm audit --omit=dev --audit-level=high

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history; fetch full so it can see every commit
          # introduced in the PR vs the base branch.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE optional; without it the org-quota free
          # tier is used. Add a secret if scan volume requires it.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  docker-image:
    name: Docker image (SEC-14/15 immutable app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose -f docker-compose.unified.yml config -q
      - name: Build app image
        run: docker compose -f docker-compose.unified.yml build app
      - name: Image-composition checks (immutable runtime)
        run: |
          set -e
          IMG=$(docker image inspect -f '{{.Id}}' infrasafe-app:latest)
          echo "Image: $IMG"
          # MUST NOT contain dev/secret artifacts (SEC-14/15).
          assert_absent() {
            if docker run --rm "$IMG" sh -c "ls -d $1 >/dev/null 2>&1"; then
              echo "❌ forbidden present in image: $1"; exit 1
            fi
            echo "✓ absent: $1"
          }
          assert_absent '/app/.env*'
          assert_absent '/app/.git'
          assert_absent '/app/scripts'
          assert_absent '/app/build'
          assert_absent '/app/node_modules/.bin/nodemon'
          assert_absent '/app/node_modules/.bin/esbuild'
          # MUST contain baked dist (express.static + extracted to edge).
          if docker run --rm "$IMG" sh -c 'ls /app/public/dist/*.js >/dev/null 2>&1'; then
            echo "✓ public/dist/*.js present"
          else
            echo "❌ public/dist bundles missing from image"; exit 1
          fi
