name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infrasafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: infrasafe_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run unit and integration tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/reports/coverage/
          retention-days: 14

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fail only on high/critical CVEs in production deps. Moderate is
      # informational — noisy across the dep tree and not actionable per-PR.
      - name: Audit production deps
        run: npm audit --omit=dev --audit-level=high

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history; fetch full so it can see every commit
          # introduced in the PR vs the base branch.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE optional; without it the org-quota free
          # tier is used. Add a secret if scan volume requires it.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  docker-image:
    name: Docker image (SEC-14/15 immutable app)
    runs-on: ubuntu-latest
    # [R2-15] packages:write lets the post-verify step push the built image to GHCR
    # (push-to-main only). contents:read is the least-privilege default for checkout.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose -f docker-compose.unified.yml config -q
      - name: Build app image
        run: docker compose -f docker-compose.unified.yml build app
      - name: Image-composition checks (immutable runtime)
        run: |
          set -e
          IMG=$(docker image inspect -f '{{.Id}}' infrasafe-app:latest)
          echo "Image: $IMG"
          # MUST NOT contain dev/secret artifacts (SEC-14/15).
          assert_absent() {
            if docker run --rm "$IMG" sh -c "ls -d $1 >/dev/null 2>&1"; then
              echo "❌ forbidden present in image: $1"; exit 1
            fi
            echo "✓ absent: $1"
          }
          assert_absent '/app/.env*'
          assert_absent '/app/.git'
          assert_absent '/app/scripts'
          assert_absent '/app/build'
          assert_absent '/app/node_modules/.bin/nodemon'
          assert_absent '/app/node_modules/.bin/esbuild'
          # MUST contain baked dist (express.static + extracted to edge).
          if docker run --rm "$IMG" sh -c 'ls /app/public/dist/*.js >/dev/null 2>&1'; then
            echo "✓ public/dist/*.js present"
          else
            echo "❌ public/dist bundles missing from image"; exit 1
          fi
          # MUST contain the bootstrap-admin CLI (SEC-13) — scripts/ is not
          # shipped, so this lives under src/ to be present in the image.
          if docker run --rm "$IMG" sh -c 'ls /app/src/cli/create-admin.js >/dev/null 2>&1'; then
            echo "✓ src/cli/create-admin.js present"
          else
            echo "❌ src/cli/create-admin.js missing from image (SEC-13 bootstrap CLI)"; exit 1
          fi

      # [EN-2] Скан уязвимостей САМОГО образа. npm audit (job выше) покрывает
      # только npm-дерево; базовый node:20-alpine и его OS-пакеты не проверял
      # никто. Стоит ДО пуша в GHCR: публиковать образ, не прошедший скан, незачем.
      #
      # Калибровка (по факту первого прогона, а не по умолчанию):
      #   * skip-dirs /usr/local/lib/node_modules — это пакеты, поставляемые с
      #     npm ВНУТРИ базового образа, а не наши. Наше прод-дерево там не лежит
      #     (`npm ls tar --omit=dev` пусто), починить их из этого репозитория
      #     нельзя, и блокировать ими пайплайн — значит выключить гейт целиком.
      #     Наш слой (/app) и OS-пакеты Alpine при этом сканируются.
      #   * блокируем на CRITICAL, HIGH только показываем. На момент введения
      #     все HIGH — это лаг Alpine в базовом образе (openssl 3.5.6-r0 при
      #     доступном 3.5.7-r0, libcurl), то есть чинятся бампом базы, а не
      #     кодом. Держать пайплайн красным из-за апстрима — верный способ
      #     приучить всех игнорировать красное. Бамп базы отслеживается
      #     отдельно (dependabot: node:20-alpine → node:26-alpine).
      #   * ignore-unfixed — без доступного фикса алерт нечем закрыть.
      # Пин по SHA, а не по тегу: это сторонний action, а тег можно переставить
      # на другой коммит. Тот же довод, что в EN-8 про gitleaks-action.
      - name: Scan image — отчёт по HIGH (не блокирует)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          image-ref: infrasafe-app:latest
          format: table
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'
          vuln-type: os,library
          skip-dirs: /usr/local/lib/node_modules

      - name: Scan image — гейт на CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          image-ref: infrasafe-app:latest
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: os,library
          skip-dirs: /usr/local/lib/node_modules

      # [R2-15] Push the EXACT image that just passed the checks above to GHCR
      # (docker tag + push — NOT a rebuild). Gated to push-on-main only, so PRs
      # still build + verify but never publish. Prod deploys pull `sha-<full>`.
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag + push verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # github.sha is a trusted 40-char commit SHA; via env for hygiene. The
          # deploy side derives the same `sha-<full>` from git rev-parse.
          GIT_SHA: ${{ github.sha }}
        run: |
          set -e
          IMG=ghcr.io/a-afanasyev/infrasafe-app
          docker tag infrasafe-app:latest "$IMG:sha-$GIT_SHA"
          docker tag infrasafe-app:latest "$IMG:main"
          docker push "$IMG:sha-$GIT_SHA"
          docker push "$IMG:main"
