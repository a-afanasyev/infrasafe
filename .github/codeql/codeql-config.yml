# CodeQL configuration — query tuning for InfraSafe.
#
# Three queries are globally excluded because they produce only false
# positives on this codebase:
#
# 1. `js/user-controlled-bypass` — fires on the early-return in
#    src/routes/webhookRoutes.js when the webhook signature header
#    is missing. The check IS the security gate (returns 401), not a
#    bypass. Downstream HMAC verification + replay protection is the
#    actual auth.
#
# 2. `js/missing-rate-limiting` — fires on POST handlers in
#    src/routes/webhookRoutes.js. Rate-limiting IS active via
#    `router.use(webhookLimiter.middleware())` above both routes
#    (60 req/min/IP). CodeQL doesn't follow the router.use chain.
#
# 3. [A-20] `js/missing-token-validation` (CSRF) — ИСКЛЮЧЕНИЕ СНЯТО 18.09.2026.
#
#    Прежнее обоснование звучало так: «проект использует JWT в заголовке
#    Authorization, а НЕ cookie-сессии, поэтому CSRF неприменим; куки
#    подключены ради внутренних debug-эндпоинтов». На момент написания это
#    было верно. Сегодня — нет: с [P1-2] токены доступа и обновления живут
#    в HttpOnly-куках (`src/utils/authCookies.js`), и middleware читает их
#    оттуда (`extractAccessToken` в `src/middleware/auth.js`). То есть
#    браузер снова отправляет учётные данные автоматически — ровно то
#    условие, при котором CSRF и работает.
#
#    Настоящая защита — Origin-guard (`src/middleware/csrfOriginGuard.js`,
#    SEC-23), подключённый в `src/routes/index.js`. Но защита в коде и
#    АНАЛИЗ — разные вещи: глобальное исключение делало слепой зоной весь
#    класс находок, включая маршруты, до которых guard может не дойти.
#
#    Находки этого запроса теперь видны и требуют разбора. Если какая-то
#    окажется ложной, подавлять её следует ПОШТУЧНО в Security-вкладке, а
#    не возвращать глобальное исключение: мы уже один раз потеряли класс
#    анализа вместе с устаревшим обоснованием.
#
# All other queries in security-and-quality stay active — real
# findings (SQL injection, XSS, log injection, path traversal, etc.)
# still fire as expected.
#
# Path-scoped exclusions would be preferable but the codeql-action
# config format only supports global query-id excludes. If these
# queries become relevant elsewhere in the codebase, revisit by
# refactoring webhookRoutes to per-route middleware stacks and
# removing these excludes.

name: InfraSafe CodeQL config

queries:
  - uses: security-and-quality

query-filters:
  - exclude:
      id: js/user-controlled-bypass
  - exclude:
      id: js/missing-rate-limiting
