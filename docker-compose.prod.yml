name: infrasafe

# ============================================================================
# DEPRECATED — Sprint 6 (2026-05-22).
# Hardening (resource limits, healthchecks, log rotation) and the UK proxy
# configuration are now consolidated in docker-compose.unified.yml. Prefer
# `docker compose -f docker-compose.unified.yml up -d` for any new deploy.
# This file is kept temporarily because a local Mac instance still uses it
# (`docker-compose.prod.yml` mounts the Dockerfile.frontend-only image and
# is wired into the developer's container set). When that local setup is
# migrated to unified.yml + an override file for the Mac-specific bits,
# delete this file. Tracked in audit-backlog under [P1-V13].
# ============================================================================
#
# Network topology (prod): the prod nginx (infrasafe-nginx-1) lives in an
# external network `infrasafe_leaflet-network` created by an older deploy. To
# avoid the post-`up -d` split-brain where the nginx upstream `app:3000`
# resolves to a stale IP, the app and frontend services join BOTH the
# project-internal network AND the external leaflet-network. Without this,
# every `docker compose up -d --no-deps app frontend` makes nginx 502 until
# someone manually `docker network connect`s with the right aliases.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend-only
      args:
        - BUILD_VERSION=${BUILD_VERSION:-dev}
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_healthy
    networks:
      infrasafe-network: {}
      leaflet-network:
        aliases: [frontend]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        - NODE_ENV=production
    expose:
      - "3000"
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - TZ=UTC
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      infrasafe-network: {}
      leaflet-network:
        aliases: [app]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: postgis/postgis:15-3.3
    env_file: .env.prod
    environment:
      # POSTGRES_* aliases are sourced from .env.prod (see DB_* mirrors there)
      - TZ=UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready without -U: returns 0 as soon as the postmaster accepts
      # connections, regardless of which roles exist. The earlier check
      # hard-coded `$POSTGRES_USER` and broke on prod after migration 017
      # renamed the runtime role to `infrasafe_app` (the `postgres` role no
      # longer exists, so the SELECT 1 probe failed with FATAL: role does
      # not exist and the container went unhealthy on every recreate). The
      # real liveness signal we need is "accepting TCP connections", which
      # is exactly what pg_isready gives us.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - infrasafe-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:
    driver: local

networks:
  infrasafe-network:
    driver: bridge
  # External network created by the older deploy (Sprint 1 era) — owns the
  # prod nginx container. Marked external:true so `docker compose up` does
  # NOT try to create or recreate it, and `down` does not destroy it. The
  # app+frontend services attach with explicit `app` / `frontend` aliases
  # so the nginx `proxy_pass http://$app_upstream` DNS lookup resolves.
  # If you ever need to recreate it locally:
  #   docker network create infrasafe_leaflet-network
  leaflet-network:
    external: true
    name: infrasafe_leaflet-network