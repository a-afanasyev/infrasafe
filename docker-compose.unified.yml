  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=Asia/Tashkent
  #   networks:
  #     - leaflet-network
  #   restart: unless-stopped

  # # Node-RED - визуальное программирование потоков данных
  # nodered:
  #   image: nodered/node-red:latest-minimal
  #   user: "1000:1000"
  #   volumes:
  #     - /home/infrasafe/node-red/data:/data
  #   ports:
  #     - "1880:1880"
  #   environment:
  #     - TZ=Asia/Tashkent
  #   networks:
  #     - leaflet-network
  #   restart: unless-stopped

  # # WireGuard - VPN сервер
  # wireguard:
  #   image: lscr.io/linuxserver/wireguard:latest
  #   privileged: true
  #   volumes:
  #     - /home/infrasafe/wireguard/config:/config
  #   ports:
  #     - "51820:51820/tcp"
  #     - "51820:51820/udp"
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=Europe/Moscow
  #     - SERVERURL=95.46.96.105
  #     - SERVERPORT=51820
  #     - PEERS=10
  #     - PEERDNS=1.1.1.1
  #     - INTERNAL_SUBNET=10.13.13.0
  #     - ALLOWEDIPS=0.0.0.0/0
  #     - LOG_CONFS=false
  #   cap_add:
  #     - NET_ADMIN
  #     - SYS_MODULE
  #   sysctls:
  #     - net.ipv4.conf.all.src_valid_mark=1
