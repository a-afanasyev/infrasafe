services:
  # Фронтенд на Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.unified
      target: frontend
    ports:
      # [P-PENTEST-1] Bind to loopback only. The TLS-terminating prod nginx is
      # the sole internet-facing edge and reaches this service via docker-DNS
      # over leaflet-network (proxy_pass http://frontend in nginx config), NOT
      # via the host-published port. Loopback-binding keeps :8080 off the
      # public interface without breaking the edge.
      - "127.0.0.1:8080:8080"
    depends_on:
      - app
    networks:
      - leaflet-network
    restart: unless-stopped
    # [Sprint 6 / P1-V13] Hardening ported from the now-deprecated
    # docker-compose.prod.yml — resource caps, healthcheck, log rotation.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      # [B-014] Use 127.0.0.1 instead of `localhost`: alpine resolves localhost
      # to ::1 (IPv6) first, but nginx binds only to 0.0.0.0 (IPv4). Result was
      # `Connection refused` on every health probe — FailingStreak=1560 (~13ч)
      # despite the public site working fine.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Бэкенд API
  app:
    build:
      context: .
      dockerfile: Dockerfile.unified
      target: backend
    ports:
      # [P-PENTEST-1] Bind to loopback only. The TLS-terminating prod nginx is
      # the sole internet-facing edge and reaches this service via docker-DNS
      # over leaflet-network (proxy_pass http://app:3000 in nginx config), NOT
      # via the host-published port. Loopback-binding keeps :3000 off the
      # public interface without breaking the edge.
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      # Named volume для логов, чтобы избежать проблем с правами доступа
      - app_logs:/app/logs
    # [1A-FU3-S-M2] DB credentials moved to .env / .env.prod (both gitignored).
    # `environment:` would override env_file in docker-compose precedence, so
    # credentials are NOT listed here.
    # Dev:  `cp .env.example .env`, edit. .env.prod absent → silently skipped.
    # Prod: only .env.prod present; .env absent → silently skipped.
    # Both are marked `required: false` so the same compose file works in
    # either mode without symlink/copy gymnastics (requires Docker Compose
    # v2.24+; server runs v2.32+).
    env_file:
      - path: .env
        required: false
      - path: .env.prod
        required: false
    environment:
      # [1A-FU3-S-M2] NODE_ENV also moved to .env so production deploys can
      # actually run in production mode. Hardcoding NODE_ENV=development here
      # caused Helmet CSP to ship with 'unsafe-inline' in script-src on the
      # production server, and Swagger UI was exposed publicly. Dev .env keeps
      # NODE_ENV=development; .env.prod sets NODE_ENV=production.
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=infrasafe
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # [B-010 2026-05-28] uk-network убран — все UK→InfraSafe webhook'и
      # приходят через public HTTPS edge (см. CLAUDE.md «Network topology»),
      # InfraSafe→UK outbound — через nginx /uk/api/* rewrite. Никаких прямых
      # docker-DNS вызовов между app и uk-network контейнерами нет.
      # Оставить только app здесь = вернёт B-011 alias collision на `postgres`
      # (uk-postgres и infrasafe-postgres-1 оба имеют alias `postgres` в своих сетях).
      #
      # infrasafe-network — где живёт postgres на проде (наследие prod.yml топологии).
      # Объявлен как external ниже чтобы compose не пересоздавал существующую сеть.
      - infrasafe-network
      # leaflet-network — общая шина с frontend / redis / nginx.
      - leaflet-network
    restart: unless-stopped
    # [Sprint 6 / P1-V13] Hardening ported from docker-compose.prod.yml.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      # [B-014] Same IPv6/IPv4 fix as frontend — use 127.0.0.1 explicitly so
      # we don't depend on the resolver's default v6/v4 preference.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # [Sprint 4] Redis — shared state for rate-limiter, cache, webhook
  # dedup. Optional service: if commented out OR if REDIS_URL is empty
  # in .env, the app falls back to in-memory implementations and runs
  # single-replica only. Enabling Redis is the prerequisite for
  # horizontal scale-out (--scale app=N).
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - leaflet-network
    restart: unless-stopped

  # База данных PostgreSQL с PostGIS
  postgres:
    image: postgis/postgis:15-3.3

    # [SEC-2] DB credentials sourced from .env / .env.prod (both gitignored),
    # mirroring docker-compose.prod.yml. No inline default — POSTGRES_PASSWORD
    # MUST come from the env_file. Same dual-file pattern as the app service:
    # dev uses .env, prod uses .env.prod; the absent one is silently skipped.
    env_file:
      - path: .env
        required: false
      - path: .env.prod
        required: false
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=infrasafe_app
      - POSTGRES_DB=infrasafe
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrasafe_app -d infrasafe"]
      interval: 5s
      timeout: 5s
      retries: 5
    # [B-016] postgres lives on infrasafe-network — the shared app↔DB bus and the
    # network the prod container actually runs in. The earlier `leaflet-network`
    # declaration was drift vs runtime (app reaches the DB over infrasafe-network,
    # which both share; leaflet is the nginx/frontend edge bus). Declaration-only
    # alignment — prod runtime already matches, so no recreate is required.
    networks:
      - infrasafe-network
    restart: unless-stopped
    # [Sprint 6 / P1-V13] Hardening ported from docker-compose.prod.yml.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # # MQTT брокер Mosquitto
  # mosquitto:
  #   image: eclipse-mosquitto:latest
  #   user: "1000:1000"
  #   ports:
  #     - "1884:1883"
  #   volumes:
  #     - /home/infrasafe/mosquitto/config:/mosquitto/config
  #     - /home/infrasafe/mosquitto/data:/mosquitto/data
  #     - /home/infrasafe/mosquitto/log:/mosquitto/log
  #   environment:
  #     - TZ=Asia/Tashkent
  #   networks:
  #     - leaflet-network
  #   restart: unless-stopped

  # # InfluxDB - база данных временных рядов
  # influxdb:
  #   image: influxdb:alpine
  #   ports:
  #     - "8086:8086"
  #   volumes:
  #     - /home/infrasafe/influxdb/data:/var/lib/influxdb2
  #     - /home/infrasafe/influxdb/conf:/etc/influxdb
  #     - /home/infrasafe/influxdb/engine:/var/lib/influxdb2/engine
  #   environment:
  #     - TZ=Asia/Tashkent
  #   networks:
  #     - leaflet-network
  #   restart: unless-stopped

  # # Grafana - визуализация метрик
  # grafana:
  #   image: grafana/grafana:latest
  #   user: "1000:1000"
  #   volumes:
  #     - /home/infrasafe/grafana/data:/var/lib/grafana
  #     - /home/infrasafe/grafana/conf:/etc/grafana
  #     - /home/infrasafe/grafana/log:/var/log/grafana
  #   ports:
  #     - "3001:3000"  # Изменен порт с 3000 на 3001, т.к. 3000 занят app
