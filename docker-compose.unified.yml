  #     - leaflet-network
  #   restart: unless-stopped

  # Nginx Production - Reverse Proxy с SSL
  # Подключён к двум сетям:
  #   - leaflet-network: app, frontend, postgres (InfraSafe stack)
  #   - uk-network: uk-frontend, uk-management-api (UK stack, external)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Production конфигурация Nginx из проекта
      # ВАЖНО: Файл должен находиться в корне проекта
      # Альтернатива: используйте абсолютный путь /home/infrasafe/nginx-docker/nginx.production.conf
      - ./nginx.production.conf:/etc/nginx/nginx.conf:ro
      # SSL сертификаты — SAN-сертификат на infrasafe.uz + infrasafe.aisolutions.uz
      # Создать на сервере: sudo certbot certonly --webroot -w ~/infrasafe/certbot-webroot
      #                      -d infrasafe.uz -d infrasafe.aisolutions.uz
      # Live-папка certbot по primary-домену (-d первым):
      - /etc/letsencrypt/live/infrasafe.uz/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/infrasafe.uz/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      - /etc/letsencrypt/live/infrasafe.uz/chain.pem:/etc/nginx/ssl/chain.pem:ro
      # ACME webroot для certbot renew без downtime (см. nginx server { listen 80 })
      - ./certbot-webroot:/var/www/certbot:rw
      # [B-002] HTML pages live in ./frontend-html/. Mounted to a SEPARATE
      # target (/srv/frontend-html), not overlaid on /usr/share/nginx/html —
      # Docker rejects sub-mounts on top of a ro parent. nginx.production.conf
      # routes HTML requests to /srv/frontend-html via a location block.
      # Previously each HTML file was bind-mounted individually, so `git pull`
      # swapped the host inode but Docker kept reading the inode the mount
      # captured at container start — that's why a `docker restart
      # infrasafe-nginx-1` was needed after every HTML deploy. Directory
      # mounts resolve through the dir entry on every request, so fresh
      # content is served the moment `git pull` lands.
      - ./frontend-html:/srv/frontend-html:ro
      # CSS / JS bundles / data — already directory mounts, kept as-is.
      - ./css:/usr/share/nginx/html/css:ro
      - ./public:/usr/share/nginx/html/public:ro
      - ./data:/usr/share/nginx/html/data:ro
    depends_on:
      - app
      - frontend
    networks:
      - leaflet-network
      - uk-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  app_logs:
  redis_data:

networks:
  leaflet-network:
    driver: bridge
  # [B-010 2026-05-28] infrasafe-network существует на проде с момента когда
  # `docker-compose.prod.yml` был активным compose-файлом. postgres всё ещё
  # привязан только к этой сети (не пересоздавали с unified.yml). Объявляем
  # её здесь как external чтобы app мог зарегиться в той же сети где postgres
  # и DNS-резолв `postgres` → `infrasafe-postgres-1` работал детерминированно.
  # Если когда-то будете чистить и пересоздавать postgres через unified.yml —
  # переведите postgres + app полностью на leaflet-network и уберите этот блок.
  infrasafe-network:
    external: true
    name: infrasafe_infrasafe-network
  # uk-network создаётся UK-стеком (docker-compose.production.yml в репо UK).
  # external: true → этот compose ожидает, что сеть уже существует.
  # Поэтому ПЕРЕД поднятием InfraSafe нужно поднять UK-стек:
  #   docker compose -f ~/uk/docker-compose.production.yml up -d
  # NB: app в этой сети НЕ должен быть (B-010 + B-011). Только nginx ниже.
  uk-network:
    external: true
    name: uk-network