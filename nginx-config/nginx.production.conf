# Production конфигурация Nginx для InfraSafe в Docker
# Домены: infrasafe.uz (primary), infrasafe.aisolutions.uz (alias)
# Обновлено: 2026-05-15 — добавлены /uk/* блоки для UK Management Bot
# Для использования в docker-compose.unified.yml
#
# UK integration: nginx находится в двух сетях (leaflet-network + uk-network),
# проксирует /uk/* → uk-frontend:80, /uk/api/* → uk-management-api:8080/api/,
# /uk/ws/* → uk-management-api:8080/ws/ (WebSocket upgrade).
# Каждая location использует ^~ priority, чтобы regex-locations не перехватывали.

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Основные оптимизации
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    reset_timedout_connection on;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;
    client_max_body_size 10M;

    # Буферы
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/rss+xml
        application/xml
        application/xhtml+xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    gzip_min_length 256;
    gzip_disable "msie6";

    # CORS map для разрешенных источников
    map $http_origin $cors_origin {
        default "";
        "~^https://infrasafe\.uz$" "https://infrasafe.uz";
        "~^https://infrasafe\.aisolutions\.uz$" "https://infrasafe.aisolutions.uz";
    }

    # ==========================================
    # [SEC-20] Edge rate-limit (defense-in-depth поверх app-слоя SEC-6)
    # ==========================================
    # Жёсткий лимит только на credential-эндпоинты (brute-force поверхность):
    # login/register/refresh/2FA. Прочие /api/auth/* (profile, logout,
    # change-password, управление 2FA) остаются под общим api-лимитом — иначе
    # при общем NAT легитимные юзеры делили бы 5r/m. Ключ пуст для не-credential
    # URI ⇒ nginx пропускает зону api_cred для них (no-op).
    # ~* (case-insensitive) + /?$ — Express routing по умолчанию case-insensitive
    # и non-strict, поэтому /api/auth/LOGIN и .../login/ бьют тот же handler;
    # case-sensitive / no-slash regex обходился бы тривиально.
    map $uri $cred_limit_key {
        default "";
        "~*^/api/auth/(login|register|refresh|verify-2fa|setup-2fa|confirm-2fa)/?$" $binary_remote_addr;
    }
    limit_req_zone $binary_remote_addr  zone=api:10m       rate=20r/s;
    limit_req_zone $cred_limit_key      zone=api_cred:10m  rate=5r/m;
    limit_req_status 429;

    # ==========================================
    # [SEC-22] UK proxy (/uk/api/*) — prefix-allowlist + edge rate-limit
    # ==========================================
    # Раньше `^~ /uk/api/` был безусловным passthrough на ВЕСЬ UK FastAPI.
    # UK прислали авторитетный контракт (2026-06-07) — пропускаем только
    # реально используемые SPA/TWA/WS/webhook префиксы; всё прочее (внутренние
    # ops `/api/health/ratelimit`,`/health/outbox`, `/api/v2/notifications/`,
    # `/docs`,`/redoc`,`/openapi.json`, любой не-перечисленный путь) → 404.
    # $uri здесь = ОРИГИНАЛЬНЫЙ путь (/uk/api/...) до rewrite.
    map $uri $uk_api_allowed {
        default 0;
        # публичные
        "~^/uk/api/v2/public(/|$)"           1;
        "~^/uk/api/v2/board-config(/|$)"     1;
        "~^/uk/api/v2/announcements(/|$)"    1;
        # credential (см. uk_cred_limit_key — жёсткий лимит)
        "~^/uk/api/v2/auth/"                 1;
        "~^/uk/api/v2/registration/"         1;
        # аутентифицированная поверхность (RBAC в приложении УК)
        # (/|$) — bare-вызываемые коллекции (УК подтвердили 2026-06-08:
        # GET/POST /api/v2/{requests,shifts,feedback} без слеша). Остальные
        # вызываются только с подпутём → trailing-slash форма достаточна.
        "~^/uk/api/v2/requests(/|$)"         1;
        "~^/uk/api/v2/callcenter/"           1;
        "~^/uk/api/v2/profile(/|$)"          1;
        "~^/uk/api/v2/shifts(/|$)"           1;
        # авто-менеджер (auto-manager, домен «Смены») — manager|admin GET/PUT
        "~^/uk/api/v2/auto-manager-config(/|$)" 1;
        "~^/uk/api/v2/executor/shifts/"      1;
        "~^/uk/api/v2/addresses/"            1;
        "~^/uk/api/v2/feedback(/|$)"         1;
        "~^/uk/api/v2/materials(/|$)"        1;
        "~^/uk/api/v2/media/"                1;
        # входящий server-to-server (наш единственный outbound, HMAC) — точный путь
        "~^/uk/api/v2/webhooks/infrasafe/alert$" 1;
        # [Учёт ресурсов] ticket-минтинг для нативной интеграции (2026-07-13) —
        # тот же upstream (uk-management-api), просто новый префикс в контракте.
        "~^/uk/api/v2/resource-accounting/"  1;
    }
    # credential-группа UK → жёсткий лимит (зеркало SEC-20). Пустой ключ ⇒ no-op.
    # ВАЖНО: ключ от $request_uri, НЕ $uri — в location ^~ /uk/api/ стоит
    # `rewrite ^/uk/api/(.*)$ /api/$1`, а limit_req (preaccess-фаза) считается
    # ПОСЛЕ rewrite-фазы, когда $uri уже = /api/v2/auth/login → regex /uk/api/…
    # не совпал бы и лимит молча не применялся. $request_uri — исходный путь,
    # rewrite его не трогает.
    map $request_uri $uk_cred_limit_key {
        default "";
        "~^/uk/api/v2/(auth|registration)/" $binary_remote_addr;
    }
    # UK orientir: общий ~120 r/min/IP, credential ~15–20 r/min/IP (не ниже их app-level).
    limit_req_zone $binary_remote_addr  zone=uk_api:10m       rate=120r/m;
    limit_req_zone $uk_cred_limit_key   zone=uk_api_cred:10m  rate=20r/m;
    # [UK access-control] WS DoS-щит для /uk/ws/v1/access/. УК подтвердили: auth
    # ПОСЛЕ handshake (cookie uk_access / JWT в первом сообщении), т.е. handshake
    # достижим анонимно через публичный edge. Без кап'а одновременных соединений
    # анонимный флуд держит сокеты до 86400s timeout → давление на worker_connections.
    # limit_conn = кап параллельных WS/IP (точный инструмент для long-lived).
    limit_conn_zone $binary_remote_addr zone=uk_access_ws:10m;
    # [F-05-хвост, аудит profk 2026-07-11] отдельная зона для management-WS
    # (/uk/ws/v2/): свой per-IP счётчик, чтобы live-экран охраны (v1/access)
    # и дашборд/TWA (v2) не делили один бюджет одновременных соединений.
    limit_conn_zone $binary_remote_addr zone=uk_mgmt_ws:10m;

    # ==========================================
    # HTTP -> HTTPS редирект (+ ACME challenge для certbot webroot)
    # ==========================================
    server {
        listen 80;
        listen [::]:80;
        server_name infrasafe.uz infrasafe.aisolutions.uz;

        # ACME webroot challenge для certbot renew без downtime
        # На хосте создать каталог: ~/infrasafe/certbot-webroot/
        # И bind-mount в nginx: /var/www/certbot:rw (см. docker-compose.unified.yml)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # Перенаправление с HTTP на HTTPS для всего остального
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================
    # HTTPS сервер
    # ==========================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name infrasafe.uz infrasafe.aisolutions.uz;

        # ==========================================
        # SSL/TLS конфигурация
        # ==========================================
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        
        # Современные протоколы и шифры
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        
        # SSL оптимизация
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

        # ==========================================
        # Безопасность - заголовки
        # ==========================================
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        # [AUD-027] "0" per OWASP — the legacy XSS auditor is itself an XS-Leak /
        # filter-bypass vector and modern browsers ignore it; CSP is the real defence.
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # [P1-3] Tightened CSP — 'unsafe-inline' dropped from script-src
        # (all previously-inline <script> blocks moved to external .js
        # files in this PR). 'unsafe-inline' is kept on style-src because
        # the HTML uses style="..." attributes; that's a low-risk vector
        # and tightening it is a separate refactor.
        # [1A-FU-S-L1] fonts.googleapis.com removed from script-src —
        # it serves CSS, not JS, so listing it there only widened the
        # script attack surface. It stays in style-src where it's used.
        # [1A-FU-S-M2] report-uri /api/csp-report — violations are logged
        # by the backend so silent CSP bypasses become observable.
        # [1A-FU2-S-M4] object-src 'none' added — blocks <object>, <embed>,
        # <applet>. Without this, default-src 'self' allows self-hosted
        # Flash/plugin objects. Defence-in-depth against legacy attack vectors.
        # [1A-FU2-S-M5] report-to + Report-To header for the modern
        # Reporting API. Chromium still honours report-uri, but it's
        # deprecated; report-to is the spec replacement. Both directives
        # in CSP + the Report-To header keep us forwards-compatible.
        add_header Report-To '{"group":"csp","max_age":10886400,"endpoints":[{"url":"/api/csp-report"}]}' always;
        # [2026-05-25] cdn.jsdelivr.net удалён из script-src — DOMPurify теперь
        # self-hosted (public/libs/dompurify/purify.min.js), нет внешних script CDN.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.tile.openstreetmap.org https://*.tile.opentopomap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://infrasafe.uz wss://infrasafe.uz https://infrasafe.aisolutions.uz wss://infrasafe.aisolutions.uz; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; report-uri /api/csp-report; report-to csp;" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Скрываем версию Nginx
        server_tokens off;

        # Корневая директория для статических файлов
        root /usr/share/nginx/html;
        index index.html index.htm;

        # ==========================================
        # UK Management Bot — подпуть /uk/*
        # Подключается через external Docker network "uk-network"
        # (см. docker-compose.unified.yml).
        # ВАЖНО: ^~ priority — иначе regex-локации (\.html$ и т.п.)
        # перехватят запросы к /uk/login, /uk/dashboard и т.п.
        # Трейлинг слэш в proxy_pass обязателен:
        #   /uk/foo → http://uk-frontend:80/foo
        # ==========================================
        # Docker embedded DNS — позволяет nginx стартовать даже когда
        # UK-стек ещё не поднят (имена резолвятся per-request, не at-parse).
        # Без этого nginx падает с "host not found in upstream" если
        # uk-management-api недоступен при reload'е.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # 8.1: /uk/api/* → UK FastAPI (REST)
        # ВАЖНО: proxy_pass с /api/ — UK FastAPI монтирует роуты под /api/...
        # /uk/api/health → http://uk-management-api:8080/api/health
        # /uk/api/v2/auth/refresh → http://uk-management-api:8080/api/v2/auth/refresh
        # Cookie Path=/uk/api/ проходит без модификаций — никаких proxy_cookie_path.
        # Переменная $uk_api_upstream → отложенный DNS lookup.
        location ^~ /uk/api/ {
            # [SEC-22] prefix-allowlist: всё, что не в контракте УК → 404.
            # `if (...) return` — безопасная форма if (rewrite-фаза, ДО limit_req,
            # поэтому 404-путь не тратит rate-бюджет).
            if ($uk_api_allowed = 0) { return 404; }
            # [SEC-22] edge rate-limit (зеркало SEC-20): общий поток + жёстче на
            # credential-группу (auth/registration). uk_cred ключ пуст ⇒ no-op.
            limit_req zone=uk_api      burst=60 nodelay;
            limit_req zone=uk_api_cred burst=10 nodelay;

            set $uk_api_upstream "uk-management-api:8080";
            # rewrite срезает /uk/api/ префикс — далее проксируем на /api/<остаток>
            rewrite ^/uk/api/(.*)$ /api/$1 break;
            proxy_pass         http://$uk_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout    30s;
            # CSP не нужен на API-ответах (только на HTML).
        }

        # 8.1: /uk/ws/v2/* → UK WebSocket
        # [SEC-22] сужено до канонического /ws/v2/ (УК подтвердили: единственный
        # префикс всех WS-каналов). Долгий read_timeout, Upgrade/Connection для handshake.
        location ^~ /uk/ws/v2/ {
            # [F-05-хвост] WS DoS-щит — зеркало /uk/ws/v1/access/: auth у УК
            # ПОСЛЕ handshake, т.е. анонимный флуд держал бы сокеты до 86400s.
            # Кап одновременных WS/IP + троттл handshake'ов (burst на reconnect).
            limit_conn uk_mgmt_ws 10;
            limit_req  zone=uk_api burst=10 nodelay;

            set $uk_ws_upstream "uk-management-api:8080";
            rewrite ^/uk/ws/(.*)$ /ws/$1 break;
            proxy_pass         http://$uk_ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout    86400s;
            proxy_send_timeout    86400s;
        }

        # ==========================================
        # [UK access-control] /uk/api/v1/access/* → uk-access-api (REST)
        # ==========================================
        # Новый сервис УК: контроль въезда (ANPR/шлагбаумы). Отдельный upstream
        # uk-access-api:8080 в том же uk-network — network-attach не требуется
        # (infrasafe-nginx-1 уже в uk-network + infrasafe_leaflet-network).
        # УК подтвердили (2026-06-29): резолвятся оба имени на один контейнер
        # (access-api = compose-service-alias, uk-access-api = container_name);
        # берём container_name ради консистентности.
        # ^~ /uk/api/v1/access/ ДЛИННЕЕ ^~ /uk/api/ → nginx выбирает его по
        # longest-prefix (порядок блоков не важен). Следствие: запрос НЕ проходит
        # SEC-22 `map $uk_api_allowed` (тот gate живёт ВНУТРИ ^~ /uk/api/), поэтому
        # сама эта location и есть explicit-allowlist для access-префикса —
        # повторяем edge rate-limit здесь же (зеркало SEC-22, зона uk_api).
        location ^~ /uk/api/v1/access/ {
            limit_req zone=uk_api burst=60 nodelay;

            set $uk_access_upstream "uk-access-api:8080";
            # rewrite срезает /uk/api/ → /uk/api/v1/access/X → /api/v1/access/X
            rewrite ^/uk/api/(.*)$ /api/$1 break;
            proxy_pass         http://$uk_access_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout    30s;
            # CSP не нужен на API-ответах (только на HTML).
        }

        # ==========================================
        # [Учёт ресурсов] /uk/api/resource/* → resource-api (REST, native — 2026-07-13)
        # ==========================================
        # Нативная интеграция «Учёт ресурсов» в дашборде УК (заменяет iframe на
        # отдельном поддомене) — браузер ходит same-origin через наш edge.
        # resource-api/resource-worker развёрнуты УК-девопсом отдельным
        # compose-проектом (НЕ в нашем git); resource-api присоединён к уже
        # существующей external-сети uk-network (тем же способом, что и
        # uk-access-api), resource-worker — фоновый воркер, HTTP не отдаёт,
        # к сети не подключён и nginx не нужен.
        # ^~ /uk/api/resource/ ДЛИННЕЕ ^~ /uk/api/ → nginx выбирает эту location
        # (longest-prefix), запрос НЕ проходит через SEC-22 `map $uk_api_allowed`
        # (тот gate живёт внутри ^~ /uk/api/) — сама location и есть
        # explicit-allowlist для этого префикса; повторяем edge rate-limit здесь
        # же (зеркало SEC-22/UK access-control, зона uk_api).
        location ^~ /uk/api/resource/ {
            limit_req zone=uk_api burst=60 nodelay;

            set $uk_resource_upstream "resource-api:8100";
            # ВАЖНО: proxy_pass с ПЕРЕМЕННОЙ upstream'ом не делает автоматическую
            # замену префикса location'а (в отличие от статического proxy_pass) —
            # нужен явный rewrite, как и в остальных /uk/api/* блоках выше.
            # /uk/api/resource/v1/auth/me → /v1/auth/me → http://resource-api:8100/v1/auth/me
            rewrite ^/uk/api/resource/(.*)$ /$1 break;
            proxy_pass         http://$uk_resource_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout    30s;
            # Same-origin (нативная интеграция, не iframe) — cookie сессии ресурса
            # first-party под доменом дашборда, SameSite=None не требуется,
            # proxy_cookie_path не нужен (path совпадает).
        }

        # ==========================================
        # [UK access-control] /uk/ws/v1/access/* → uk-access-api (WebSocket)
        # ==========================================
        # Live-экран охраны. Same-origin wss://<host>/uk/ws/v1/access/... —
        # connect-src 'self' + wss://infrasafe.uz уже в CSP /uk/-страниц, доп.
        # CSP-правил не нужно. Долгий read/send timeout + Upgrade/Connection
        # для handshake (зеркало ^~ /uk/ws/v2/).
        location ^~ /uk/ws/v1/access/ {
            # [WS DoS-щит] кап одновременных WS/IP (оператор=1, TWA-житель=неск.;
            # 10 с запасом) + троттл темпа handshake'ов (burst для reconnect-блипов).
            # Анонимный handshake-флуд с одного IP упрётся; реальный экран не заметит.
            limit_conn uk_access_ws 10;
            limit_req  zone=uk_api burst=10 nodelay;

            set $uk_access_ws_upstream "uk-access-api:8080";
            # /uk/ws/v1/access/X → /ws/v1/access/X
            rewrite ^/uk/ws/(.*)$ /ws/$1 break;
            proxy_pass         http://$uk_access_ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout    86400s;
            proxy_send_timeout    86400s;
        }

        # 8.1: /uk/* → UK SPA (статика)
        # Trailing slash в proxy_pass — обязательно: /uk/login → /login на uk-frontend.
        # CSP отдельный, разрешает Telegram Login Widget (oauth.telegram.org).
        # 502/503/504 → /uk-unavailable.html (graceful degradation, § 10.9).
        location ^~ /uk/ {
            set $uk_fe_upstream "uk-frontend:80";
            rewrite ^/uk/(.*)$ /$1 break;
            proxy_pass         http://$uk_fe_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout    30s;

            # CSP для UK: Telegram Login Widget требует telegram.org / oauth.telegram.org
            # connect-src покрывает оба домена (primary + alias) — иначе с alias
            # WebSocket к /uk/ws/* блокируется.
            # [P1-12] Google Fonts CSS allowed in style-src so /uk/* pages
            # don't hit CSP errors loading https://fonts.googleapis.com. The
            # font files themselves are already permitted via font-src
            # (https://fonts.gstatic.com). Matches the pattern used in the
            # InfraSafe-side CSP blocks above.
            # [F-08-хвост] frame-ancestors вместо X-Frame-Options: TWA (Mini App)
            # живёт в iframe web.telegram.org в веб-версии Telegram, а XFO не
            # умеет allowlist — поэтому XFO здесь осознанно НЕ выставляется,
            # clickjacking-защита только через CSP.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org https://oauth.telegram.org; frame-src https://oauth.telegram.org; connect-src 'self' https://infrasafe.uz wss://infrasafe.uz https://infrasafe.aisolutions.uz wss://infrasafe.aisolutions.uz; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'self' https://web.telegram.org; base-uri 'self'; form-action 'self';" always;

            error_page 502 503 504 /uk-unavailable.html;
        }

        # Fallback page when UK is down. См. § 10.9.
        # Файл монтируется bind-mount'ом из ~/infrasafe/uk-unavailable.html.
        location = /uk-unavailable.html {
            # [B-002] HTML живёт в /srv/frontend-html
            root /srv/frontend-html;
            internal;
        }

        # ==========================================
        # Запрет доступа к source-map файлам
        # Source-maps раскрывают исходную структуру модулей и mapping
        # минифицированных имён — безопасно в dev, запрещено в prod.
        # ==========================================
        location ~ \.map$ {
            return 404;
            access_log off;
            log_not_found off;
        }

        # ==========================================
        # Кэширование статических файлов
        # ==========================================
        location ~* \.(jpg|jpeg|gif|png|ico|svg|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # [R2-17] NGINX PITFALL: the add_header above kills inheritance of the
            # server-level security headers — re-emit nosniff so static assets keep
            # MIME-sniffing protection (see the HTML block for the full rationale).
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # [hotfix 2026-05-27] Was: expires 1y + immutable → JS/CSS cached for a
        # YEAR without revalidating; hotfixes couldn't reach deployed clients.
        # Reduced to max-age=300 + must-revalidate.
        # [B-027-followup 2026-06-01] But must-revalidate only kicks in AFTER
        # max-age, so a fresh deploy stayed invisible to returning clients for
        # up to 5 min — hit during B-024 prod verification (the browser served a
        # pre-deploy bundle from its 300s cache window). Switch to `no-cache`
        # (revalidate-always): every request is a conditional GET, ETag returns
        # 304 for unchanged files (≈no bandwidth cost) and 200 with the new
        # bytes immediately on the next navigation after a deploy.
        # Single Cache-Control header now: `expires off` stops the expires
        # module from emitting its own (the old block sent two — `expires 5m`
        # plus the add_header). Content-hashed filenames (admin-auth.<sha>.js)
        # remain the "proper" perf fix (immutable long-cache, zero revalidation)
        # — tracked as a future item in sprint-11-backlog.md.
        # ==========================================
        # [BRAND] Каталог бренда: /brand/ → public/brand-<name>/
        # ==========================================
        # Один alias решает, каким брендом выглядит InfraSafe на этом хосте.
        # HTML на обоих хостах ОДИНАКОВ и ссылается на /brand/brand.css,
        # /brand/favicon.svg, /brand/mark.svg — форка страниц нет.
        # Переключение бренда = правка alias + `nginx -s reload`, без
        # пересборки образа. Механизм описан в public/brand-default/brand.css.
        #
        # ⚠️ `location ^~` выигрывает у regex-локаций, поэтому блок
        # `~* \.(css|js)$` ниже сюда НЕ применяется — заголовки кэша и nosniff
        # приходится повторять здесь. Та же ловушка наследования add_header,
        # что описана ниже по файлу.
        location ^~ /brand/ {
            alias /usr/share/nginx/html/public/brand-default/;
            expires off;
            add_header Cache-Control "public, no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # Логотипы нейтрального бренда НЕ копируются в public/brand-default/:
        # это обёртки <svg> вокруг base64-PNG весом 1.3 МБ каждая, и вторая
        # копия в репозитории ничего не даёт. Точный `location =` выигрывает
        # у `^~` выше и отдаёт существующие файлы на месте.
        # У брендированного каталога будут собственные mark.svg/mark-small.svg,
        # и эти два блока для него не нужны.
        location = /brand/mark.svg {
            alias /usr/share/nginx/html/public/images/infrasafe-logo.svg;
            expires off;
            add_header Cache-Control "public, no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }
        location = /brand/mark-small.svg {
            alias /usr/share/nginx/html/public/images/infrasafe-small-logo.svg;
            expires off;
            add_header Cache-Control "public, no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        location ~* \.(css|js)$ {
            expires off;
            add_header Cache-Control "public, no-cache";
            # [R2-17] Re-emit nosniff — the add_header above drops the server-level
            # security headers. Most important here: JS/CSS without nosniff are the
            # classic MIME-sniffing vector.
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        location ~* \.(woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # [R2-17] Re-emit nosniff — add_header above drops inherited security headers.
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # HTML файлы без кэширования.
        # [B-002] root /srv/frontend-html: страницы лежат в directory-bind-mount'е
        # (не в image и не в individual file mounts), чтобы git pull сразу
        # обновлял содержимое без `docker restart nginx`. Этот block matches
        # любой *.html запрос — он объявлен перед более специфичным regex'ом,
        # nginx берёт первый matching regex location.
        location ~* \.(html|htm)$ {
            root /srv/frontend-html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            # ⚠️ NGINX PITFALL: any `add_header` at location level kills inheritance
            # of ALL `add_header` from the parent server block (including the ones
            # marked `always`). Without re-emitting them here, HTML responses ship
            # with NO security headers — CSP, HSTS, X-Frame, X-Content-Type, etc.
            # are silently dropped.
            # Fix: re-emit the full security-header block. Keep this in sync with
            # the server-level block above.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "0" always;  # [AUD-027] OWASP — header retired
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # [1A-FU2-S-M4 + S-M5] mirror of server-level CSP: object-src
            # 'none' + report-to directive + Report-To header. Keep in sync
            # with line ~152 above.
            add_header Report-To '{"group":"csp","max_age":10886400,"endpoints":[{"url":"/api/csp-report"}]}' always;
            # [2026-05-25] cdn.jsdelivr.net удалён из script-src — DOMPurify self-hosted.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.tile.openstreetmap.org https://*.tile.opentopomap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://infrasafe.uz wss://infrasafe.uz https://infrasafe.aisolutions.uz wss://infrasafe.aisolutions.uz; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; report-uri /api/csp-report; report-to csp;" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        }

        # ==========================================
        # API проксирование
        # Variable upstream + resolver — deferred DNS lookup.
        # Без переменной nginx кеширует upstream IP при parse → 502 после
        # пересоздания сети (docker compose down/up). См. также UK блоки.
        # ==========================================
        location /api/ {
            # [SEC-20] Два стэкнутых лимита в одном location (не дублируем
            # proxy/CORS отдельным блоком). burst щедрый: дашборд/карта стреляют
            # десятками параллельных /api/* на загрузке — тесный лимит положит SPA.
            limit_req zone=api      burst=40 nodelay;   # общий поток
            limit_req zone=api_cred burst=5  nodelay;   # для не-credential URI ключ пуст ⇒ no-op

            # CORS preflight обработка
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-Request-ID' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }

            # Проксирование к backend через Docker сеть.
            # Переменная $app_upstream → DNS lookup per-request через
            # resolver 127.0.0.11 (Docker embedded DNS), объявленный выше.
            set $app_upstream "app:3000";
            proxy_pass http://$app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Отключаем буферизацию
            proxy_buffering off;
            proxy_request_buffering off;

            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # CORS заголовки для обычных ответов
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Vary' 'Origin' always;
        }

        # ==========================================
        # [SEC-34g] Swagger закрыт в проде (обе формы: exact + prefix).
        # Раньше проксировался на app:3000/api-docs/ → раскрывал API-схему.
        # ==========================================
        location = /api-docs  { return 404; }
        location ^~ /api-docs/ { return 404; }

        # ==========================================
        # Основная страница — index.html из B-002 mount-а
        # ==========================================
        location = / {
            root /srv/frontend-html;
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ==========================================
        # Health check endpoint
        # ==========================================
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        # ==========================================
        # Обработка ошибок
        # ==========================================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}

