# Production конфигурация Nginx для InfraSafe в Docker
# Домены: infrasafe.uz (primary), infrasafe.aisolutions.uz (alias)
# Обновлено: 2026-05-15 — добавлены /uk/* блоки для UK Management Bot
# Для использования в docker-compose.unified.yml
#
# UK integration: nginx находится в двух сетях (leaflet-network + uk-network),
# проксирует /uk/* → uk-frontend:80, /uk/api/* → uk-management-api:8080/api/,
# /uk/ws/* → uk-management-api:8080/ws/ (WebSocket upgrade).
# Каждая location использует ^~ priority, чтобы regex-locations не перехватывали.

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Основные оптимизации
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    reset_timedout_connection on;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;
    client_max_body_size 10M;

    # Буферы
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/rss+xml
        application/xml
        application/xhtml+xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    gzip_min_length 256;
    gzip_disable "msie6";

    # CORS map для разрешенных источников
    map $http_origin $cors_origin {
        default "";
        "~^https://infrasafe\.uz$" "https://infrasafe.uz";
        "~^https://infrasafe\.aisolutions\.uz$" "https://infrasafe.aisolutions.uz";
    }

    # ==========================================
    # HTTP -> HTTPS редирект (+ ACME challenge для certbot webroot)
    # ==========================================
    server {
        listen 80;
        listen [::]:80;
        server_name infrasafe.uz infrasafe.aisolutions.uz;

        # ACME webroot challenge для certbot renew без downtime
        # На хосте создать каталог: ~/infrasafe/certbot-webroot/
        # И bind-mount в nginx: /var/www/certbot:rw (см. docker-compose.unified.yml)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # Перенаправление с HTTP на HTTPS для всего остального
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================
    # HTTPS сервер
    # ==========================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name infrasafe.uz infrasafe.aisolutions.uz;

        # ==========================================
        # SSL/TLS конфигурация
        # ==========================================
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        
        # Современные протоколы и шифры
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        
        # SSL оптимизация
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

        # ==========================================
        # Безопасность - заголовки
        # ==========================================
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # [P1-3] Tightened CSP — 'unsafe-inline' dropped from script-src
        # (all previously-inline <script> blocks moved to external .js
        # files in this PR). 'unsafe-inline' is kept on style-src because
        # the HTML uses style="..." attributes; that's a low-risk vector
        # and tightening it is a separate refactor.
        # [1A-FU-S-L1] fonts.googleapis.com removed from script-src —
        # it serves CSS, not JS, so listing it there only widened the
        # script attack surface. It stays in style-src where it's used.
        # [1A-FU-S-M2] report-uri /api/csp-report — violations are logged
        # by the backend so silent CSP bypasses become observable.
        # [1A-FU2-S-M4] object-src 'none' added — blocks <object>, <embed>,
        # <applet>. Without this, default-src 'self' allows self-hosted
        # Flash/plugin objects. Defence-in-depth against legacy attack vectors.
        # [1A-FU2-S-M5] report-to + Report-To header for the modern
        # Reporting API. Chromium still honours report-uri, but it's
        # deprecated; report-to is the spec replacement. Both directives
        # in CSP + the Report-To header keep us forwards-compatible.
        add_header Report-To '{"group":"csp","max_age":10886400,"endpoints":[{"url":"/api/csp-report"}]}' always;
        # [2026-05-25] cdn.jsdelivr.net удалён из script-src — DOMPurify теперь
        # self-hosted (public/libs/dompurify/purify.min.js), нет внешних script CDN.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://infrasafe.uz wss://infrasafe.uz https://infrasafe.aisolutions.uz wss://infrasafe.aisolutions.uz; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; report-uri /api/csp-report; report-to csp;" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Скрываем версию Nginx
        server_tokens off;

        # Корневая директория для статических файлов
        root /usr/share/nginx/html;
        index index.html index.htm;

        # ==========================================
        # UK Management Bot — подпуть /uk/*
        # Подключается через external Docker network "uk-network"
        # (см. docker-compose.unified.yml).
        # ВАЖНО: ^~ priority — иначе regex-локации (\.html$ и т.п.)
        # перехватят запросы к /uk/login, /uk/dashboard и т.п.
        # Трейлинг слэш в proxy_pass обязателен:
        #   /uk/foo → http://uk-frontend:80/foo
        # ==========================================
        # Docker embedded DNS — позволяет nginx стартовать даже когда
        # UK-стек ещё не поднят (имена резолвятся per-request, не at-parse).
        # Без этого nginx падает с "host not found in upstream" если
        # uk-management-api недоступен при reload'е.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # 8.1: /uk/api/* → UK FastAPI (REST)
        # ВАЖНО: proxy_pass с /api/ — UK FastAPI монтирует роуты под /api/...
        # /uk/api/health → http://uk-management-api:8080/api/health
        # /uk/api/v2/auth/refresh → http://uk-management-api:8080/api/v2/auth/refresh
        # Cookie Path=/uk/api/ проходит без модификаций — никаких proxy_cookie_path.
        # Переменная $uk_api_upstream → отложенный DNS lookup.
        location ^~ /uk/api/ {
            set $uk_api_upstream "uk-management-api:8080";
            # rewrite срезает /uk/api/ префикс — далее проксируем на /api/<остаток>
            rewrite ^/uk/api/(.*)$ /api/$1 break;
            proxy_pass         http://$uk_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout    30s;
            # CSP не нужен на API-ответах (только на HTML).
        }

        # 8.1: /uk/ws/* → UK WebSocket
        # Долгий read_timeout, Upgrade/Connection headers для WS handshake.
        location ^~ /uk/ws/ {
            set $uk_ws_upstream "uk-management-api:8080";
            rewrite ^/uk/ws/(.*)$ /ws/$1 break;
            proxy_pass         http://$uk_ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout    86400s;
            proxy_send_timeout    86400s;
        }

        # 8.1: /uk/* → UK SPA (статика)
        # Trailing slash в proxy_pass — обязательно: /uk/login → /login на uk-frontend.
        # CSP отдельный, разрешает Telegram Login Widget (oauth.telegram.org).
        # 502/503/504 → /uk-unavailable.html (graceful degradation, § 10.9).
        location ^~ /uk/ {
            set $uk_fe_upstream "uk-frontend:80";
            rewrite ^/uk/(.*)$ /$1 break;
            proxy_pass         http://$uk_fe_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout    30s;

            # CSP для UK: Telegram Login Widget требует telegram.org / oauth.telegram.org
            # connect-src покрывает оба домена (primary + alias) — иначе с alias
            # WebSocket к /uk/ws/* блокируется.
            # [P1-12] Google Fonts CSS allowed in style-src so /uk/* pages
            # don't hit CSP errors loading https://fonts.googleapis.com. The
            # font files themselves are already permitted via font-src
            # (https://fonts.gstatic.com). Matches the pattern used in the
            # InfraSafe-side CSP blocks above.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org https://oauth.telegram.org; frame-src https://oauth.telegram.org; connect-src 'self' https://infrasafe.uz wss://infrasafe.uz https://infrasafe.aisolutions.uz wss://infrasafe.aisolutions.uz; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

            error_page 502 503 504 /uk-unavailable.html;
        }

        # Fallback page when UK is down. См. § 10.9.
        # Файл монтируется bind-mount'ом из ~/infrasafe/uk-unavailable.html.
        location = /uk-unavailable.html {
            # [B-002] HTML живёт в /srv/frontend-html
            root /srv/frontend-html;
            internal;
        }

        # ==========================================
        # Запрет доступа к source-map файлам
        # Source-maps раскрывают исходную структуру модулей и mapping
        # минифицированных имён — безопасно в dev, запрещено в prod.
        # ==========================================
        location ~ \.map$ {
            return 404;
            access_log off;
            log_not_found off;
        }

        # ==========================================
        # Кэширование статических файлов
        # ==========================================
        location ~* \.(jpg|jpeg|gif|png|ico|svg|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # [hotfix 2026-05-27] Was: expires 1y + immutable → JS/CSS cached for a
        # YEAR without revalidating; hotfixes couldn't reach deployed clients.
        # Reduced to max-age=300 + must-revalidate.
        # [B-027-followup 2026-06-01] But must-revalidate only kicks in AFTER
        # max-age, so a fresh deploy stayed invisible to returning clients for
        # up to 5 min — hit during B-024 prod verification (the browser served a
        # pre-deploy bundle from its 300s cache window). Switch to `no-cache`
        # (revalidate-always): every request is a conditional GET, ETag returns
        # 304 for unchanged files (≈no bandwidth cost) and 200 with the new
        # bytes immediately on the next navigation after a deploy.
        # Single Cache-Control header now: `expires off` stops the expires
        # module from emitting its own (the old block sent two — `expires 5m`
        # plus the add_header). Content-hashed filenames (admin-auth.<sha>.js)
        # remain the "proper" perf fix (immutable long-cache, zero revalidation)
        # — tracked as a future item in sprint-11-backlog.md.
        location ~* \.(css|js)$ {
            expires off;
            add_header Cache-Control "public, no-cache";
            access_log off;
        }

        location ~* \.(woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # HTML файлы без кэширования.
        # [B-002] root /srv/frontend-html: страницы лежат в directory-bind-mount'е
        # (не в image и не в individual file mounts), чтобы git pull сразу
        # обновлял содержимое без `docker restart nginx`. Этот block matches
        # любой *.html запрос — он объявлен перед более специфичным regex'ом,
        # nginx берёт первый matching regex location.
        location ~* \.(html|htm)$ {
            root /srv/frontend-html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            # ⚠️ NGINX PITFALL: any `add_header` at location level kills inheritance
            # of ALL `add_header` from the parent server block (including the ones
            # marked `always`). Without re-emitting them here, HTML responses ship
            # with NO security headers — CSP, HSTS, X-Frame, X-Content-Type, etc.
            # are silently dropped.
            # Fix: re-emit the full security-header block. Keep this in sync with
            # the server-level block above.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # [1A-FU2-S-M4 + S-M5] mirror of server-level CSP: object-src
            # 'none' + report-to directive + Report-To header. Keep in sync
            # with line ~152 above.
            add_header Report-To '{"group":"csp","max_age":10886400,"endpoints":[{"url":"/api/csp-report"}]}' always;
            # [2026-05-25] cdn.jsdelivr.net удалён из script-src — DOMPurify self-hosted.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://infrasafe.uz wss://infrasafe.uz https://infrasafe.aisolutions.uz wss://infrasafe.aisolutions.uz; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; report-uri /api/csp-report; report-to csp;" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        }

        # ==========================================
        # API проксирование
        # Variable upstream + resolver — deferred DNS lookup.
        # Без переменной nginx кеширует upstream IP при parse → 502 после
        # пересоздания сети (docker compose down/up). См. также UK блоки.
        # ==========================================
        location /api/ {
            # CORS preflight обработка
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-Request-ID' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }

            # Проксирование к backend через Docker сеть.
            # Переменная $app_upstream → DNS lookup per-request через
            # resolver 127.0.0.11 (Docker embedded DNS), объявленный выше.
            set $app_upstream "app:3000";
            proxy_pass http://$app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Отключаем буферизацию
            proxy_buffering off;
            proxy_request_buffering off;

            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # CORS заголовки для обычных ответов
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Vary' 'Origin' always;
        }

        # ==========================================
        # Swagger документация
        # ==========================================
        location /api-docs/ {
            set $app_upstream "app:3000";
            proxy_pass http://$app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # Основная страница — index.html из B-002 mount-а
        # ==========================================
        location = / {
            root /srv/frontend-html;
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ==========================================
        # Health check endpoint
        # ==========================================
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        # ==========================================
        # Обработка ошибок
        # ==========================================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}

