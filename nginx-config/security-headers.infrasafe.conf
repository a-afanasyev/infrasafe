# [CO-11] Канонический набор заголовков безопасности — ОДНА копия.
#
# Зачем файл. `add_header` в nginx не складывается: любой `add_header` внутри
# location отменяет наследование ВСЕХ `add_header` родительского server-блока.
# Шесть статических location'ов (infrasafe.uz) переизлучали ровно один `nosniff` и
# теряли остальные шесть заголовков. Измерено на живом периметре 18.09.2026:
# /css/style.css, /public/dist/theme-toggle.js, /brand/brand.css и
# /brand/favicon.svg приходили ТОЛЬКО с x-content-type-options. SVG здесь
# существеннее прочего: это документ, и по прямой ссылке он исполнялся в нашем
# origin без CSP.
#
# Подключается через `include /etc/nginx/custom/security-headers.infrasafe.conf;`
# (каталог nginx-config смонтирован как /etc/nginx/custom). Отсутствующий файл
# роняет `nginx -t` — молча обнулить набор эта конструкция не может.
#
# Значения обязаны совпадать с server-блоком nginx.production.conf; расхождение ловит
# tests/jest/unit/nginxHeaderInheritance.test.js.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Report-To '{"group":"csp","max_age":10886400,"endpoints":[{"url":"/api/csp-report"}]}' always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.tile.openstreetmap.org https://*.tile.opentopomap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://infrasafe.uz wss://infrasafe.uz https://infrasafe.aisolutions.uz wss://infrasafe.aisolutions.uz; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; report-uri /api/csp-report; report-to csp;" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
