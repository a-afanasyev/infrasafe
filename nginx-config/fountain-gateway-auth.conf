# [FOUNTAIN] Авторизация на контроллере для локаций ОСНОВНОГО хоста.
#
# Подключается ТОЛЬКО там, где перед этим стоит `auth_request` — то есть где
# доступ уже решила наша авторизация. Подключить это туда, где нашей проверки
# нет, значит открыть панель всем: сервер сам предъявит устройству пароль.
#
# Клиентский Authorization до устройства не доходит вовсе: иначе пользователь
# подставил бы свои учётные данные и обошёл проверку роли, а устройство увидело
# бы чужой заголовок.
proxy_set_header Authorization "";

# Файла может не быть (не сгенерирован) — тогда glob не найдёт ничего, и nginx
# поднимется БЕЗ подстановки. Это осознанный выбор: строгий include уронил бы
# `nginx -t` и перезагрузку всего периметра, то есть infrasafe.uz, из-за одной
# панели. Отсутствие проверяет scripts/fountain-inject-auth.sh --check.
include /etc/nginx/custom/fountain-auth.*.conf;

# Вызов Basic от устройства НЕ должен доходить до браузера: иначе поверх нашей
# страницы всплывёт системное окно ввода пароля, а внутри iframe браузер его
# просто заблокирует и оставит пустую рамку. Если подстановка не сработала,
# пользователь увидит наш 401, а не диалог устройства.
proxy_hide_header WWW-Authenticate;
