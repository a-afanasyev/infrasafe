# [FOUNTAIN] Общая часть проксирования к панели фонтана.
#
# Подключается ТОЛЬКО из двух разрешённых локаций вхоста fountain.infrasafe.uz.
# Вынесено в отдельный файл, чтобы параметры соединения не разошлись между
# панелью и потоком событий: у них разные настройки буферизации, но одинаковая
# адресация и одинаковый набор заголовков.
#
# Путь запроса: nginx → контейнер infrasafe-wireguard-1 (порт 8080) → DNAT на
# 10.13.13.12:80 → туннель. Источник подменяется на 10.13.13.1, поэтому
# контроллер не видит docker-сетей площадки. Правила живут в PostUp внутри
# wg0.conf, восстанавливаются scripts/wireguard-fountain-peer.sh.

# Имя разрешается в момент ЗАПРОСА, а не разбора конфига: иначе перезапуск
# nginx падал бы, пока контейнер WireGuard не поднят. Resolver объявлен в самом
# server-блоке — между соседними server он не наследуется.
set $fountain_upstream "infrasafe-wireguard-1:8080";

# URI передаётся ДОСЛОВНО, через $request_uri. Это не украшение: панель закрыта
# Digest-аутентификацией, а Digest считает ответ по запрошенному адресу. Стоит
# nginx переписать путь (например, `proxy_pass http://…/;` со слэшем) — браузер
# подпишет один URI, контроллер посчитает по другому, и получится бесконечный
# цикл 401, неотличимый от неверного пароля.
proxy_pass http://$fountain_upstream$request_uri;

proxy_http_version 1.1;
# Пустой Connection — иначе keep-alive до апстрима не работает, а для SSE это
# означает переустановку соединения на каждом событии.
proxy_set_header Connection "";

# Внешний Host сохраняется: он должен совпадать с Origin браузера.
proxy_set_header Host $http_host;

# Digest живёт на двух заголовках, и оба должны ходить насквозь.
proxy_set_header Authorization $http_authorization;
proxy_pass_header WWW-Authenticate;

# Куки Infrasafe в апстрим не идут. Сегодня они и так host-only для infrasafe.uz
# (Domain у них не выставлен — проверено в src/utils/authCookies.js), то есть на
# этот вхост браузер их не пошлёт. Строка стоит на случай, если Domain когда-то
# появится: у HTTP-сервера контроллера ограничен размер заголовков, и лишняя
# кука там кончается не ошибкой аутентификации, а обрывом запроса.
proxy_set_header Cookie "";

# Accept-Encoding НЕ трогаем намеренно: панель лежит в прошивке уже сжатой и
# отдаётся с Content-Encoding: gzip. Снять заголовок — значит заставить
# контроллер распаковывать её на лету.
