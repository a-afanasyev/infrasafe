# [FOUNTAIN] Общая часть проксирования к контроллеру фонтана.
#
# Подключается ТОЛЬКО из перечисленных поимённо локаций. Путь запроса:
# nginx → контейнер infrasafe-wireguard-1 (порт 8080) → DNAT на 10.13.13.12:80
# → туннель. Источник подменяется на 10.13.13.1, поэтому контроллер не видит
# docker-сетей площадки. Правила живут в PostUp внутри wg0.conf,
# восстанавливаются scripts/wireguard-fountain-peer.sh.

# Имя разрешается в момент ЗАПРОСА, а не разбора конфига: иначе перезапуск
# nginx падал бы, пока контейнер WireGuard не поднят.
set $fountain_upstream "infrasafe-wireguard-1:8080";

proxy_http_version 1.1;
# Пустой Connection — иначе keep-alive до апстрима не работает, а для потока
# событий это означает переустановку соединения на каждом сообщении.
proxy_set_header Connection "";

# Внешние Host и Origin сохраняются — по требованию разработчика.
proxy_set_header Host $http_host;
proxy_set_header Origin $http_origin;

# [FOUNTAIN] Авторизация на контроллере подставляется СЕРВЕРОМ, а не берётся у
# клиента. Клиентский Authorization до устройства не доходит вовсе: иначе
# пользователь мог бы подставить свои учётные данные и обойти нашу проверку
# роли, а заодно устройство увидело бы чужой заголовок.
proxy_set_header Authorization "";
# Файла может не быть (свежая площадка, не сгенерирован) — тогда glob не найдёт
# ничего, и nginx поднимется БЕЗ подстановки. Это осознанный выбор: строгий
# include уронил бы `nginx -t` и перезагрузку всего периметра, то есть
# infrasafe.uz, из-за одной панели. Отсутствие проверяет
# scripts/fountain-inject-auth.sh --check.
include /etc/nginx/custom/fountain-auth.*.conf;

# Куки Infrasafe в апстрим не идут: у HTTP-сервера контроллера ограничен размер
# заголовков, и лишняя кука там кончается не ошибкой аутентификации, а обрывом
# запроса.
proxy_set_header Cookie "";

# [FOUNTAIN] Вызов Basic от устройства НЕ должен доходить до браузера: иначе
# поверх нашей страницы всплывёт системное окно ввода пароля, а внутри iframe
# браузер его просто заблокирует и оставит пустую рамку. Если подстановка выше
# не сработала, пользователь увидит наш 401, а не диалог устройства.
proxy_hide_header WWW-Authenticate;

# Устройство одно, повторять запрос не на чем; для POST повтор недопустим по
# требованию разработчика — это была бы вторая команда реле.
proxy_next_upstream off;

# Accept-Encoding НЕ трогаем: панель лежит в прошивке уже сжатой и отдаётся с
# Content-Encoding: gzip. Снять заголовок — заставить контроллер распаковывать
# её на лету.
