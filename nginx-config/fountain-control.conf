# [FOUNTAIN] Общая часть управляющих запросов — круг администратора.
#
# Подключается из каждой управляющей локации, перечисленной поимённо. Отдельным
# файлом, чтобы набор проверок физически не мог разойтись между командами: если
# одна из одиннадцати точек окажется слабее прочих, это и будет та самая точка.
#
# Здесь три независимых барьера, и каждый закрывает своё:
#   1. роль — подзапрос к /api/auth/gate/admin (роль берётся из БАЗЫ);
#   2. источник — Origin обязан быть нашим;
#   3. признак панели — заголовок X-Fountain-Control.
#
# Ни один из них не «доказательство» сам по себе. Роль — единственное настоящее
# разрешение; остальные два лишь сужают поверхность.

# Роль проверяется на КАЖДОЙ команде, а не один раз за сессию: подзапрос
# выполняется для каждого запроса отдельно. Снятие прав действует немедленно —
# в отличие от уже открытого потока событий, который проверялся при открытии.
auth_request /__fountain_gate_admin;
auth_request_set $fountain_user $upstream_http_x_auth_user;
auth_request_set $fountain_username $upstream_http_x_auth_username;

# [FOUNTAIN] Origin обязан быть нашим. Куки сессии и так SameSite=strict, то
# есть браузер не пошлёт их с чужого сайта и подзапрос роли не пройдёт, — но
# это защита, о которой мы узнаём только из чужих настроек по умолчанию.
# Проверка Origin — наша собственная и не зависит от поведения браузера.
if ($http_origin != "https://infrasafe.uz") { return 403; }

# Признак панели. Разработчик присылает его на каждой команде и прямо называет
# дополнительной проверкой, а не доказательством роли. Требуем: заголовок,
# который посылают, но не проверяют, — украшение.
if ($http_x_fountain_control != "1") { return 403; }

# Кеширование здесь НЕ выключается через add_header намеренно: [CO-11] любой
# add_header внутри location обнуляет весь серверный набор заголовков
# безопасности, и одна строка про кеш стоила бы шести про защиту. Собственного
# кеша у nginx на этих путях нет, а POST браузеры не кешируют. Для
# GET-запроса capabilities запрет ставится в его локации через `expires`,
# который на наследование не влияет.
